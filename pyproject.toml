[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basicam-cnc"
version = "0.1.0"
description = "Cross-platform CAD/CAM desktop prototype"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "pyvista>=0.44",
  "pyvistaqt>=0.11",
  "trimesh>=4.4",
  "ezdxf>=1.3",
  "numpy>=1.26",
  "cadquery-ocp>=8.0.1",
  "pyserial>=3.5",
]

[project.optional-dependencies]
solidworks = ["pywin32>=306; sys_platform == 'win32'"]
build = [
  "pyinstaller>=6.10",
  "pywin32>=306; sys_platform == 'win32'",
]

[tool.setuptools.packages.find]
include = ["basicam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]